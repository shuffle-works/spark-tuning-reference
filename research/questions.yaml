# Question registry — single source of truth for the answering pipeline.
# Field reference (see also docs/architecture.md):
#
# sections[].id         section key, e.g. "3.6-shuffle" — matches the projection
#                       file/manifest grouping
# sections[].num        human section number, e.g. "3.6"
# sections[].title      display title, e.g. "Shuffle"
# sections[].default_k  retrieval k for the section's questions unless overridden
# questions[].id        stable "<num>-qNN"; never renumbered or reused
# questions[].section   foreign key to sections[].id
# questions[].text      the question, verbatim, as passed to ask.py
# questions[].version   "3.0" | "3.5" | "4.0" | "n/a" -> ask.py --version
# questions[].k         per-question retrieval override; null -> section default_k
# questions[].status    "pending" | "answered" | "needs-review"
#
# NOTE: this comment is a documentation aid on the committed snapshot only.
# scripts/registry.py:save_registry() uses yaml.safe_dump, which does not
# preserve comments — any CLI write (add_question, recompute_question, ...)
# regenerates this file without it. Re-add it manually after such an edit if
# you want it to persist; it is not read by any script.
