name: citation-link-check

# Report-only: weekly scan + manual trigger. NEVER a PR gate.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Run citation link-checker
        id: check
        run: |
          set -o pipefail
          uv run scripts/check_citations.py | tee report.txt

      - name: Open or update tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('report.txt')
              ? fs.readFileSync('report.txt', 'utf8')
              : '(no report captured)';
            const title = 'Broken citation links detected';
            const body = [
              'The scheduled citation link-checker found failing citations.',
              '',
              '```',
              report.slice(-60000),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'citations',
            });
            const hit = existing.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['citations'],
              });
            }
