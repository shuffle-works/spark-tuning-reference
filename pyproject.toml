[project]
name = "spark-tuning-reference"
version = "0.21.0"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[dependency-groups]
research = [
  "trafilatura>=1.12",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "tiktoken>=0.7",
  "rich>=15.0.0",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  # test_mcp_server.py imports scripts.mcp_server, which needs the mcp
  # package to import at all (fakes stand in for the actual model/collection,
  # so the heavier research group stays out of dev).
  "mcp>=1.0",
  # ask.py and fetch_references.py's main() print through rich; it's a light,
  # pure-Python dep (unlike chromadb/sentence-transformers/trafilatura, which
  # stay research-only), so it's cheap to install here just to test main()'s
  # branching with the actual fetchers/model/collection mocked out.
  "rich>=15.0.0",
]
mcp = [
  "mcp>=1.0",
  # the server does real retrieval, so it needs the embedding/index runtime
  {include-group = "research"},
]

[tool.coverage.run]
# build_index.py imports chromadb/sentence-transformers/tiktoken — the
# `research` group, deliberately left out of CI's `dev`-only install (see
# .github/workflows/ci.yml) to keep CI fast. It can never be imported, let
# alone exercised, in the environment `--cov=scripts` runs in, so counting
# its lines against the coverage denominator only understates real coverage.
omit = ["scripts/build_index.py"]
